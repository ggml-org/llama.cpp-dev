name: Todo Counts

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v6

      - name: Install gnuplot
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gnuplot-nox

      - name: Run todo-counts
        run: ./todo-counts.sh

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README-todo-counts.md todo-counts.png todo-counts.csv
          git commit -m "auto: update todo counts" || exit 0
          git stash --include-untracked && git pull --rebase origin "$(git branch --show-current)"
          git push
