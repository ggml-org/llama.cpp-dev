name: Compile Times

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup dependencies
        run: ./setup.sh

      - name: Run compile-times
        run: ./compile-times.sh

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README-compile-times.md compile-times.png compile-times.csv
          git commit -m "auto: update compile times" || exit 0
          git pull --rebase origin "$(git branch --show-current)"
          git push
